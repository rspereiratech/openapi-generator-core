name: Publish SNAPSHOT

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy core SNAPSHOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check the version is a SNAPSHOT
        id: version
        run: |
          # Read from the POM directly: mvn would have to resolve a parent that may not be on Central yet.
          VERSION=$(sed -n '/<parent>/,/<\/parent>/d; s:^    <version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          [ -n "$VERSION" ] || VERSION=$(sed -n '/<parent>/,/<\/parent>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml)
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$VERSION is a release version; it is published by the release workflow. Skipping."
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy SNAPSHOT
        if: steps.version.outputs.snapshot == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: mvn -B -ntp --settings ci-settings.xml -Psnapshot -DskipTests deploy
