name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Sibling repos are released one after another: a push here can run before the
      # parent and upstream modules of the same version reach Maven Central.
      - name: Wait for upstream releases on Maven Central
        env:
          UPSTREAM: openapi-generator-parent
        run: |
          VERSION=$(sed -n '/<parent>/,/<\/parent>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Parent is $VERSION: nothing to wait for."
            exit 0
          fi
          for a in $UPSTREAM; do
            url="https://repo1.maven.org/maven2/io/github/rspereiratech/$a/$VERSION/$a-$VERSION.pom"
            for i in $(seq 1 120); do
              if curl -sfI "$url" > /dev/null; then echo "$a $VERSION is on Maven Central."; continue 2; fi
              echo "Waiting for $a $VERSION ($i/120)..."
              sleep 30
            done
            echo "::error::$a $VERSION is not on Maven Central after 60 minutes."
            exit 1
          done

      - name: Build and test
        run: mvn -B -ntp --settings ci-settings.xml clean verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
